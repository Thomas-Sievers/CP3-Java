# Activate with: --spring.profiles.active=oracle (or SPRING_PROFILES_ACTIVE=oracle)
# Override the defaults below via env vars instead of editing this file.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
spring.datasource.username=${ORACLE_USERNAME:equipment_rent}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
