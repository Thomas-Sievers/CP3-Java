spring.application.name=equipment_rent

# Default profile: in-memory H2, browsable at /h2-console (JDBC URL below, user sa, blank password)
spring.datasource.url=jdbc:h2:mem:equipment_rent
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
